<header class="bg-gradient-to-r from-slate-50 to-white shadow-lg border-b border-slate-200">
    <div class="px-8 py-4">
        <div class="flex justify-between items-center">
            <!-- Left Section - Title and Breadcrumb -->
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 text-sm text-slate-500">
                    <span>Home</span>
                    <i class="fas fa-chevron-right text-xs"></i>
                    <span id="breadcrumb-current" class="text-slate-700 font-medium">Dashboard</span>
                </div>
            </div>

            <!-- Right Section - Actions and Notifications -->
            <div class="flex items-center space-x-4">
                <!-- Enhanced Search Bar -->
                <div class="relative">
                    <input type="text" 
                           id="global-search"
                           placeholder="Search trips, users, chats..." 
                           class="w-80 px-4 py-2 pl-10 pr-10 bg-slate-100 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200"
                           onkeyup="if(event.key === 'Enter') app.search(this.value)">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <button onclick="app.clearSearch()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center space-x-2">
                    <!-- Import Button -->
                    <button onclick="document.getElementById('import-file').click()" 
                            class="group relative px-4 py-2 bg-gradient-to-r from-amber-500 to-orange-600 text-white rounded-xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">
                        <i class="fas fa-upload mr-2"></i>
                        <span class="text-sm font-medium">Import</span>
                        <div class="absolute inset-0 rounded-xl bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-200"></div>
                    </button>
                    <input type="file" id="import-file" accept=".json" style="display: none;" onchange="app.importData(this.files[0])">

                    <!-- Export Button -->
                    <button onclick="app.exportData()" 
                            class="group relative px-4 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">
                        <i class="fas fa-download mr-2"></i>
                        <span class="text-sm font-medium">Export</span>
                        <div class="absolute inset-0 rounded-xl bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-200"></div>
                    </button>

                    <!-- Refresh Button -->
                    <button onclick="app.refreshData()" 
                            class="group relative px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">
                        <i class="fas fa-sync-alt mr-2 group-hover:animate-spin"></i>
                        <span class="text-sm font-medium">Refresh</span>
                        <div class="absolute inset-0 rounded-xl bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-200"></div>
                    </button>

                    <!-- Settings Button -->
                    <button onclick="app.openSettings()" 
                            class="group relative px-4 py-2 bg-gradient-to-r from-slate-500 to-slate-700 text-white rounded-xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">
                        <i class="fas fa-cog mr-2 group-hover:animate-spin"></i>
                        <span class="text-sm font-medium">Settings</span>
                        <div class="absolute inset-0 rounded-xl bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-200"></div>
                    </button>

                    <!-- Help Button -->
                    <button onclick="app.openHelp()" 
                            class="group relative px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">
                        <i class="fas fa-question-circle mr-2"></i>
                        <span class="text-sm font-medium">Help</span>
                        <div class="absolute inset-0 rounded-xl bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-200"></div>
                    </button>

                    <!-- Theme Toggle Button -->
                    <button onclick="app.toggleTheme()" 
                            class="group relative px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-600 text-white rounded-xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">
                        <i class="fas fa-moon mr-2" id="theme-icon"></i>
                        <span class="text-sm font-medium">Theme</span>
                        <div class="absolute inset-0 rounded-xl bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-200"></div>
                    </button>

                    <!-- Notifications -->
                    <div class="relative group">
                        <button class="relative p-2 bg-gradient-to-r from-slate-100 to-slate-200 rounded-xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">
                            <i class="fas fa-bell text-slate-600 group-hover:text-indigo-600 transition-colors duration-200"></i>
                            <span class="absolute -top-1 -right-1 h-3 w-3 bg-gradient-to-r from-red-500 to-pink-500 rounded-full animate-pulse"></span>
                            <span class="absolute -top-2 -right-2 h-5 w-5 bg-red-500 rounded-full text-white text-xs flex items-center justify-center font-bold">3</span>
                        </button>
                        
                        <!-- Notification Dropdown -->
                        <div class="absolute right-0 top-12 w-80 bg-white rounded-xl shadow-2xl border border-slate-200 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
                            <div class="p-4">
                                <div class="flex items-center justify-between mb-3 pb-3 border-b border-slate-200">
                                    <h3 class="font-semibold text-slate-800">Notifications</h3>
                                    <button class="text-xs text-indigo-600 hover:text-indigo-700">Mark all read</button>
                                </div>
                                <div class="space-y-3">
                                    <div class="flex items-start space-x-3 p-3 hover:bg-slate-50 rounded-lg transition-colors cursor-pointer">
                                        <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center flex-shrink-0">
                                            <i class="fas fa-user-plus text-white text-xs"></i>
                                        </div>
                                        <div class="flex-1">
                                            <p class="text-sm font-medium text-slate-800">New user registered</p>
                                            <p class="text-xs text-slate-500">2 minutes ago</p>
                                        </div>
                                    </div>
                                    <div class="flex items-start space-x-3 p-3 hover:bg-slate-50 rounded-lg transition-colors cursor-pointer">
                                        <div class="w-8 h-8 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-full flex items-center justify-center flex-shrink-0">
                                            <i class="fas fa-map-marked-alt text-white text-xs"></i>
                                        </div>
                                        <div class="flex-1">
                                            <p class="text-sm font-medium text-slate-800">New trip created</p>
                                            <p class="text-xs text-slate-500">15 minutes ago</p>
                                        </div>
                                    </div>
                                    <div class="flex items-start space-x-3 p-3 hover:bg-slate-50 rounded-lg transition-colors cursor-pointer">
                                        <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-600 rounded-full flex items-center justify-center flex-shrink-0">
                                            <i class="fas fa-comments text-white text-xs"></i>
                                        </div>
                                        <div class="flex-1">
                                            <p class="text-sm font-medium text-slate-800">New chat message</p>
                                            <p class="text-xs text-slate-500">1 hour ago</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- User Profile Dropdown -->
                    <div class="relative group">
                        <button class="flex items-center space-x-3 p-2 bg-gradient-to-r from-indigo-100 to-purple-100 rounded-xl hover:shadow-lg transform hover:scale-105 transition-all duration-200">
                            <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center">
                                <i class="fas fa-user text-white text-sm"></i>
                            </div>
                            <div class="text-left">
                                <p class="text-sm font-medium text-slate-800">Admin User</p>
                                <p class="text-xs text-slate-500">Administrator</p>
                            </div>
                            <i class="fas fa-chevron-down text-slate-600 text-xs"></i>
                        </button>
                        
                        <!-- Profile Dropdown -->
                        <div class="absolute right-0 top-12 w-72 bg-white rounded-xl shadow-2xl border border-slate-200 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
                            <div class="p-4 border-b border-slate-200">
                                <div class="flex items-center space-x-3">
                                    <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center">
                                        <i class="fas fa-user text-white text-lg"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-slate-800">Admin User</h3>
                                        <p class="text-sm text-slate-500">admin@riendzo.com</p>
                                    </div>
                                </div>
                            </div>
                            <div class="p-2">
                                <a href="#" class="flex items-center space-x-3 px-3 py-2 hover:bg-slate-50 rounded-lg transition-colors">
                                    <i class="fas fa-user-circle text-slate-600"></i>
                                    <span class="text-sm text-slate-700">My Profile</span>
                                </a>
                                <a href="#" class="flex items-center space-x-3 px-3 py-2 hover:bg-slate-50 rounded-lg transition-colors">
                                    <i class="fas fa-cog text-slate-600"></i>
                                    <span class="text-sm text-slate-700">Account Settings</span>
                                </a>
                                <a href="#" class="flex items-center space-x-3 px-3 py-2 hover:bg-slate-50 rounded-lg transition-colors">
                                    <i class="fas fa-shield-alt text-slate-600"></i>
                                    <span class="text-sm text-slate-700">Security</span>
                                </a>
                                <hr class="my-2 border-slate-200">
                                <a href="#" onclick="app.logout()" class="flex items-center space-x-3 px-3 py-2 hover:bg-red-50 rounded-lg transition-colors">
                                    <i class="fas fa-sign-out-alt text-red-600"></i>
                                    <span class="text-sm text-red-600">Logout</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
